<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Marsa Maroc Container Management</title>
    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-surface: rgba(30, 41, 59, 0.7);
            --primary: #0284c7;
            --accent: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(51, 65, 85, 0.5);
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Port Background with overlay */
        .port-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/static/images/port_bg.jpg') no-repeat center center/cover;
            filter: brightness(0.7) saturate(1.1);
            z-index: 1;
        }

        .port-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.5) 20%, rgba(2, 132, 199, 0.15) 80%);
            z-index: 2;
        }

        /* Glassmorphism Container */
        .login-card {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.6);
            z-index: 10;
            transform: translateY(0);
            transition: all 0.4s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-logo span {
            color: var(--accent);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* Role Selector Tabs */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .role-tab {
            padding: 12px;
            text-align: center;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-tab.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 16px 14px 48px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1);
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #0284c7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }


    </style>
</head>
<body>
    <div class="port-background"></div>
    <div class="port-glow"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">MARSA <span>MAROC</span></div>
            <div class="login-subtitle">Port Container Logistics Suite</div>
        </div>

        <div class="role-selector">
            <button type="button" class="role-tab active" onclick="setRole('agent')">Agent Portuaire</button>
            <button type="button" class="role-tab" onclick="setRole('armateur')">Armateur B2B</button>
        </div>

        <div class="error-message" id="errorMessage">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="errorText">Identifiants incorrects</span>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Adresse Email</label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" class="form-control" placeholder="nom@marsamaroc.ma" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de Passe</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-login">Se Connecter</button>
        </form>


    </div>

    <!-- Universal AI Assistant Widget -->
    <script src="/static/js/ai-widget.js"></script>

    <script>
        let currentRole = 'agent';

        // Clear stored session on load to log out user
        localStorage.clear();

        function setRole(role) {
            currentRole = role;
            const tabs = document.querySelectorAll('.role-tab');
            const emailInput = document.getElementById('email');
            
            tabs[0].classList.toggle('active', role === 'agent');
            tabs[1].classList.toggle('active', role === 'armateur');

            if (role === 'agent') {
                emailInput.placeholder = 'nom@marsamaroc.ma';
                emailInput.value = 'agent@marsamaroc.ma';
                document.getElementById('password').value = 'agent';
            } else {
                emailInput.placeholder = 'armateur@armateur.com';
                emailInput.value = 'maersk@armateur.com';
                document.getElementById('password').value = 'maersk';
            }
        }

        // Set default credentials on mount
        setRole('agent');

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('errorMessage');
            const errText = document.getElementById('errorText');

            errDiv.style.display = 'none';

            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error("Email ou mot de passe incorrect");
                }
                return res.json();
            })
            .then(data => {
                // Save user metadata
                localStorage.setItem('user_name', data.name);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('user_email', data.email);
                
                // Redirect based on role
                if (data.role === 'Agent Portuaire') {
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/espace_client';
                }
            })
            .catch(err => {
                errText.innerText = err.message;
                errDiv.style.display = 'flex';
            });
        }
    </script>
</body>
</html>
